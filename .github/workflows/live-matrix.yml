name: Live Azure Path Matrix

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "'all' = existing Prompt/Hosted one-offs; name scratch fallbacks explicitly"
        required: true
        default: all
        type: string
  schedule:
    - cron: "0 16 * * 0"

permissions:
  contents: read

concurrency:
  group: agent-insights-live-matrix
  cancel-in-progress: false

jobs:
  live-matrix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AGENT_INSIGHTS_LIVE_ENABLED == 'true'
    runs-on:
      - self-hosted
      - Windows
      - agent-insights-live
    environment: live-azure
    timeout-minutes: 720
    outputs:
      execution_id: ${{ steps.identity.outputs.execution_id }}
      manifest_artifact: ${{ steps.identity.outputs.manifest_artifact }}
    env:
      AGENT_INSIGHTS_LIVE_CASES: ${{ inputs.cases || 'all' }}
      AGENT_INSIGHTS_LIVE_SUBSCRIPTION_ID: ${{ vars.AGENT_INSIGHTS_LIVE_SUBSCRIPTION_ID }}
      AGENT_INSIGHTS_LIVE_LOCATION: ${{ vars.AGENT_INSIGHTS_LIVE_LOCATION }}
      AGENT_INSIGHTS_LIVE_MODEL_NAME: ${{ vars.AGENT_INSIGHTS_LIVE_MODEL_NAME }}
      AGENT_INSIGHTS_LIVE_MODEL_VERSION: ${{ vars.AGENT_INSIGHTS_LIVE_MODEL_VERSION }}
      MATRIX_EXECUTION_ID: live-${{ github.run_id }}-${{ github.run_attempt }}
      MATRIX_MANIFEST_ARTIFACT: matrix-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
      MATRIX_OUTPUT_DIR: .agent-insights\live-matrix\live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Record the creating execution identity
        id: identity
        shell: pwsh
        run: |
          "execution_id=$env:MATRIX_EXECUTION_ID" | Out-File $env:GITHUB_OUTPUT -Append
          "manifest_artifact=$env:MATRIX_MANIFEST_ARTIFACT" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify interactive Azure session
        shell: pwsh
        run: |
          if (-not $env:AGENT_INSIGHTS_LIVE_SUBSCRIPTION_ID) {
            throw "Set AGENT_INSIGHTS_LIVE_SUBSCRIPTION_ID in the live-azure environment."
          }
          if (-not $env:AGENT_INSIGHTS_LIVE_LOCATION) {
            throw "Set AGENT_INSIGHTS_LIVE_LOCATION in the live-azure environment."
          }
          $userType = az account show --query user.type -o tsv
          if ($LASTEXITCODE -ne 0 -or $userType -ne "user") {
            throw "The self-hosted runner requires an active interactive Azure CLI user session."
          }
      - name: Run disposable one-off quality matrix
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -u `
            .agents\skills\agent-insights-onboarding\scripts\agent_insights_live_matrix.py `
            --confirm-live `
            --execution-id $env:MATRIX_EXECUTION_ID `
            --output-dir $env:MATRIX_OUTPUT_DIR 2>&1 | ForEach-Object { Write-Host $_ }
          $exitCode = $LASTEXITCODE
          "## One-off quality smoke matrix (not human acceptance)" | Out-File $env:GITHUB_STEP_SUMMARY
          $summaryPath = Join-Path $env:MATRIX_OUTPUT_DIR "summary.json"
          if (Test-Path -LiteralPath $summaryPath) {
            '```json' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content -LiteralPath $summaryPath | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          exit $exitCode
      - name: Upload exact execution cleanup manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MATRIX_MANIFEST_ARTIFACT }}
          path: ${{ env.MATRIX_OUTPUT_DIR }}\cleanup-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized matrix summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-insights-live-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MATRIX_OUTPUT_DIR }}\summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  cleanup:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      vars.AGENT_INSIGHTS_LIVE_ENABLED == 'true')
    needs: live-matrix
    runs-on:
      - self-hosted
      - Windows
      - agent-insights-live
    environment: live-azure
    timeout-minutes: 120
    env:
      AGENT_INSIGHTS_LIVE_SUBSCRIPTION_ID: ${{ vars.AGENT_INSIGHTS_LIVE_SUBSCRIPTION_ID }}
      MATRIX_EXECUTION_ID: ${{ needs.live-matrix.outputs.execution_id }}
      MATRIX_MANIFEST_ARTIFACT: ${{ needs.live-matrix.outputs.manifest_artifact }}
      MATRIX_CLEANUP_DIR: .agent-insights\matrix-cleanup\${{ needs.live-matrix.outputs.execution_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the creating job's identity even when retrying only cleanup
        shell: pwsh
        run: |
          if (-not $env:MATRIX_EXECUTION_ID -or -not $env:MATRIX_MANIFEST_ARTIFACT) {
            throw "The creating job did not record its identity; cleanup cannot select another execution."
          }
      - name: Download only this execution's cleanup manifest
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.MATRIX_MANIFEST_ARTIFACT }}
          path: ${{ env.MATRIX_CLEANUP_DIR }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify creating identity and clean only manifested groups
        shell: pwsh
        run: |
          $userType = az account show --query user.type -o tsv
          if ($LASTEXITCODE -ne 0 -or $userType -ne "user") {
            throw "The cleanup runner requires an active interactive Azure CLI user session."
          }
          $manifest = Join-Path $env:MATRIX_CLEANUP_DIR "cleanup-manifest.json"
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "Missing execution manifest: cleanup is incomplete, not skipped successfully."
          }
          python `
            .agents\skills\agent-insights-onboarding\scripts\agent_insights_live_matrix.py `
            --confirm-live `
            --cleanup-manifest $manifest `
            --execution-id $env:MATRIX_EXECUTION_ID
          exit $LASTEXITCODE
      - name: Upload checked cleanup manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matrix-cleanup-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MATRIX_CLEANUP_DIR }}\cleanup-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
