name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .agents/skills/agent-insights-onboarding/scripts
      - name: Test
        run: pytest --cov=insights_onboarding --cov-report=term-missing --cov-fail-under=65

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep
        run: az bicep install
      - name: Build templates
        shell: bash
        run: |
          set -euo pipefail
          root=".agents/skills/agent-insights-onboarding/assets/infra"
          az bicep build --file "$root/main.bicep" --stdout >/dev/null
          az bicep build --file "$root/existing-connections.bicep" --stdout >/dev/null

  skill:
    name: Agent Skill
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Agent Skill
        run: gh skill publish .agents/skills --dry-run
