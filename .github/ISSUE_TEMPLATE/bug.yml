name: Bug report
description: Report a reproducible problem in the onboarding workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, keys, connection strings, authorization headers, or customer telemetry.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Onboarding path
      options:
        - Existing Foundry project
        - Scratch Prompt Agent
        - Scratch code-based Hosted Agent
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Sanitized steps and the CLI error code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
